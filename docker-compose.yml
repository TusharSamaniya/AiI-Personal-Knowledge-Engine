version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8001:8000"
    volumes:
      - ./backend/chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - chromadb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

  worker:
    build: ./backend
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - backend
      - chromadb
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend