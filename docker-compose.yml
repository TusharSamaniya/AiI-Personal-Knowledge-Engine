version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8001:8000"
    volumes:
      - ./backend/chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - chromadb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - FRONTEND_URL=http://localhost:5173

  worker:
    build: ./backend
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - backend
      - chromadb
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # ── KEY FIX ──────────────────────────────────────────────────────────
    # Do NOT mount ./frontend:/app here.
    # That volume would overwrite the node_modules that npm install built
    # inside the container, making all packages (framer-motion, gsap, etc.)
    # disappear at runtime — which is why clicking buttons did nothing.
    #
    # VITE_* vars must be passed as `environment:` (not just env_file)
    # because Vite reads them at dev-server startup from the process env,
    # not from the .env file on disk inside the container.
    # ─────────────────────────────────────────────────────────────────────
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
